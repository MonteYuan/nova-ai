name: NovaAI
options:
  bundleIdPrefix: com.novaai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NovaAI:
    type: application
    platform: iOS
    sources:
      - path: NovaAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novaai.app
        INFOPLIST_KEY_CFBundleDisplayName: Nova AI
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
