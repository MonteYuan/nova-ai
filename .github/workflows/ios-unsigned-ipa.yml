name: NovaAI Unsigned Device IPA

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for physical iPhone (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project NovaAI.xcodeproj \
            -scheme NovaAI \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="build/DeviceDerivedData/Build/Products/Debug-iphoneos/NovaAI.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/NovaAI.app
          cd build/ipa
          /usr/bin/zip -qry ../../NovaAI-unsigned.ipa Payload
          test -s ../../NovaAI-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-Unsigned-IPA
          path: ios/NovaAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
